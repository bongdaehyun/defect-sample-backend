name: deploy-dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build
      # 샘플이라 실제 서버는 없다. 빌드가 성공하면 dev 배포에 성공한 것으로 본다.
      - run: echo "dev 배포 완료 ${GITHUB_SHA}"
